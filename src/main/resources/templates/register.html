<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Register | Employee Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fb;
        }

        .card{
            width:420px;
            margin:70px auto;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,.15);
        }
    </style>
</head>

<body>

<div class="card">

    <h2 class="text-center mb-4">Register</h2>

    <!-- Error Message -->
    <div class="alert alert-danger"
         th:if="${error}"
         th:text="${error}">
    </div>

    <!-- Success Message -->
    <div class="alert alert-success"
         th:if="${success}"
         th:text="${success}">
    </div>

    <form th:action="@{/register}"
          th:object="${user}"
          method="post">

        <!-- CSRF Token -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}"/>

        <div class="mb-3">
            <label>Username</label>
            <input type="text"
                   class="form-control"
                   th:field="*{username}"
                   required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email"
                   class="form-control"
                   th:field="*{email}"
                   required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password"
                   class="form-control"
                   th:field="*{password}"
                   required>
        </div>

        <button type="submit"
                class="btn btn-primary w-100">
            Register
        </button>

    </form>

    <hr>

    <p class="text-center">
        Already have an account?
        <a th:href="@{/login}">Login</a>
    </p>

</div>

</body>
</html>
