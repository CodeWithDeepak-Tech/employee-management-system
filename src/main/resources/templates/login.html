<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            height:100vh;

            background:linear-gradient(135deg,#eef5ff,#f5f9ff);

            display:flex;

            justify-content:center;

            align-items:center;

            font-family:'Segoe UI',sans-serif;

        }

        .login-card{

            width:410px;

            background:white;

            border-radius:20px;

            padding:45px;

            box-shadow:0 18px 40px rgba(0,0,0,.12);

        }

        .logo{

            width:85px;

            height:85px;

            border-radius:50%;

            background:#0d6efd;

            display:flex;

            justify-content:center;

            align-items:center;

            margin:auto;

            color:white;

            font-size:34px;

            box-shadow:0 10px 25px rgba(13,110,253,.30);

        }

        h2{

            text-align:center;

            font-weight:700;

            margin-top:20px;

            color:#243b53;

        }

        .subtitle{

            text-align:center;

            color:#7a8899;

            margin-bottom:30px;

        }

        .form-control{

            border-radius:12px;

            padding:12px;

            border:1px solid #dbe2ea;

        }

        .form-control:focus{

            border-color:#0d6efd;

            box-shadow:0 0 8px rgba(13,110,253,.15);

        }

        .input-group-text{

            border-radius:12px 0 0 12px;

            background:#f4f7fb;

        }

        .btn-login{

            width:100%;

            border-radius:12px;

            padding:12px;

            font-size:17px;

            font-weight:600;

        }

        .footer{

            text-align:center;

            margin-top:25px;

            color:#7a8899;

            font-size:14px;

        }

        .alert{

            border-radius:12px;

        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="logo">

        <i class="bi bi-people-fill"></i>

    </div>

    <h2>Employee Management</h2>

    <div class="subtitle">

        Secure Login Portal

    </div>

    <div th:if="${param.error}" class="alert alert-danger">

        Invalid Username or Password

    </div>

    <div th:if="${param.logout}" class="alert alert-success">

        Logged out successfully

    </div>

    <form th:action="@{/login}" method="post">

        <div class="mb-3">

            <label class="form-label">

                Username

            </label>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-person-fill"></i>

                </span>

                <input type="text"

                       name="username"

                       class="form-control"

                       placeholder="Enter username"

                       required>

            </div>

        </div>

        <div class="mb-4">

            <label class="form-label">

                Password

            </label>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-lock-fill"></i>

                </span>

                <input type="password"

                       name="password"

                       class="form-control"

                       placeholder="Enter password"

                       required>

            </div>

        </div>

        <button class="btn btn-primary btn-login">

            <i class="bi bi-box-arrow-in-right"></i>

            Login

        </button>

    </form>

    <div class="footer">

        © 2026 Employee Management System

    </div>

</div>

</body>
</html>
