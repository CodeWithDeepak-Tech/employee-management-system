<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Employee Management System | Login</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:linear-gradient(135deg,#eef5ff,#f7fbff);

            font-family:'Segoe UI',sans-serif;

        }

        .login-card{

            width:430px;

            background:white;

            border-radius:20px;

            padding:45px;

            box-shadow:0 18px 40px rgba(0,0,0,.12);

        }

        .logo{

            width:90px;

            height:90px;

            border-radius:50%;

            background:#0d6efd;

            display:flex;

            justify-content:center;

            align-items:center;

            margin:auto;

            color:white;

            font-size:36px;

            box-shadow:0 10px 25px rgba(13,110,253,.30);

        }

        h2{

            text-align:center;

            margin-top:20px;

            font-weight:700;

            color:#23395d;

        }

        .subtitle{

            text-align:center;

            color:#6c757d;

            margin-bottom:25px;

        }

        .form-control{

            border-radius:12px;

            padding:12px;

        }

        .input-group-text{

            border-radius:12px 0 0 12px;

            background:#f4f6fa;

        }

        .btn-login{

            width:100%;

            padding:12px;

            border-radius:12px;

            font-weight:600;

            font-size:17px;

        }

        .alert{

            border-radius:12px;

        }

        .register-link{

            text-align:center;

            margin-top:20px;

        }

        .footer{

            text-align:center;

            margin-top:25px;

            color:#6c757d;

            font-size:14px;

        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="logo">

        <i class="bi bi-people-fill"></i>

    </div>

    <h2>Employee Management</h2>

    <div class="subtitle">

        Secure Login Portal

    </div>

    <!-- Login Error -->

    <div th:if="${param.error}"

         class="alert alert-danger">

        Invalid Username or Password

    </div>

    <!-- Logout -->

    <div th:if="${param.logout}"

         class="alert alert-success">

        Logged out successfully.

    </div>

    <!-- Registration Success -->

    <div th:if="${param.registered}"

         class="alert alert-success">

        Registration Successful. Please Login.

    </div>

    <form th:action="@{/login}"

          method="post">

        <div class="mb-3">

            <label class="form-label">

                Username

            </label>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-person-fill"></i>

                </span>

                <input

                        type="text"

                        name="username"

                        class="form-control"

                        placeholder="Enter Username"

                        required>

            </div>

        </div>

        <div class="mb-4">

            <label class="form-label">

                Password

            </label>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-lock-fill"></i>

                </span>

                <input

                        type="password"

                        name="password"

                        class="form-control"

                        placeholder="Enter Password"

                        required>

            </div>

        </div>

        <button class="btn btn-primary btn-login">

            <i class="bi bi-box-arrow-in-right"></i>

            Login

        </button>

    </form>

    <div class="register-link">

        Don't have an account?

        <a th:href="@{/register}">

            Register Here

        </a>

    </div>

    <div class="footer">

        © 2026 Employee Management System

    </div>

</div>

</body>

</html>
